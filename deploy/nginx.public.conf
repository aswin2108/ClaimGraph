# frontend/nginx.conf plus per-visitor limits, for the public demo only (mounted by docker-compose.deploy.yml).
# Requests reach nginx only through Caddy on the compose network, so the client IP is taken from the
# X-Forwarded-For header Caddy sets (Caddy overwrites whatever the visitor sends).

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Only POSTs count against the write limit (an empty key is never limited).
map $request_method $post_client {
  default "";
  POST    $binary_remote_addr;
}

limit_req_zone  $binary_remote_addr zone=api_all:10m   rate=10r/s;  # every API call
limit_req_zone  $post_client        zone=api_post:10m  rate=20r/m;  # submit, challenge, decide, close, reset
limit_req_zone  $binary_remote_addr zone=api_agent:10m rate=1r/m;   # AI agent runs (cost)
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Agent runs: up to 3 at once, then 1 per minute per visitor (the API's hourly and daily
  # budgets still apply on top). Runs can take ~90 s, hence the long read timeout.
  location ~ ^/api/claims/[^/]+/agent$ {
    limit_req  zone=api_agent burst=2 nodelay;
    limit_req  zone=api_post burst=20 nodelay;
    limit_conn conn_ip 20;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host api;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
  }

  # The API is only reachable through this proxy. Its DNS-rebinding guard accepts the Host "api".
  location /api/ {
    limit_req  zone=api_all burst=60 nodelay;
    limit_req  zone=api_post burst=20 nodelay;
    limit_conn conn_ip 20;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host api;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    client_max_body_size 2m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
